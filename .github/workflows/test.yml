name: Test Suite

on:
  pull_request:
    branches:
      - master
      - dev
  push:
    branches:
      - master
      - dev
      - skill-rating-overhaul

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-testing.txt

      - name: Run historical and upstream reference tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run production-default rating tests
        # Separate process: historical conftest mocks libraries and reference paths.
        run: python -m pytest tests_rating/ -v --tb=short
