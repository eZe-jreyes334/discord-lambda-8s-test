name: Test Suite

on:
  pull_request:
    branches:
      - master
      - dev
  push:
    branches:
      - master
      - dev

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-testing.txt

      - name: Run pytest
        run: |
          python -m pytest tests/ -v --tb=short
          # Separate process: legacy conftest replaces boto3 and TrueSkill globally.
          python -m pytest tests_rating/ -v --tb=short
